[package]
name = "auralis_ui"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.108"
js-sys = "=0.3.85"
serde_json = "1"
web-sys = { version = "=0.3.85", features = ["Window", "Document", "HtmlHeadElement", "Element", "HtmlElement", "HtmlInputElement", "Node", "NodeList", "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "DomRect", "CssStyleDeclaration", "DomTokenList", "Performance", "ScrollToOptions", "ScrollBehavior", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
